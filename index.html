<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>排版桌 — IG Post Planner</title>
    <script src="database.js" onerror="console.log('尚未偵測到 database.js')"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #FBF9F4;
            --paper-raised: #FFFFFF;
            --paper-line: #E4DFD3;
            --ink: #1C1B19;
            --ink-soft: #5B5648;
            --ink-faint: #A39B8B;
            --red-pen: #B5482A;
            --red-pen-deep: #93371E;
            --green-stamp: #2F6F5E;
            --amber-flag: #B8852C;
            --danger: #B5482A;
            --topbar-h: 52px;
            --font-display: 'Noto Serif TC', serif;
            --font-body: 'Noto Sans TC', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; font-family: var(--font-body); margin: 0; padding: 0; }
        body {
            background: var(--paper); display: flex; flex-direction: column;
            height: 100vh; color: var(--ink); overflow: hidden;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--paper-line); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }
        :focus-visible { outline: 2px solid var(--red-pen); outline-offset: 1px; }

        /* =====================================================
           TOPBAR
        ===================================================== */
        .topbar {
            height: var(--topbar-h); flex-shrink: 0;
            background: var(--paper-raised); border-bottom: 1px solid var(--paper-line);
            display: flex; align-items: center; padding: 0 20px; gap: 16px; z-index: 50;
        }
        .brand-area { display: flex; align-items: baseline; gap: 7px; margin-right: 4px; }
        .brand-mark { font-family: var(--font-display); font-weight: 900; font-size: 17px; color: var(--ink); }
        .brand-sub { font-size: 9px; color: var(--ink-faint); font-family: var(--font-mono); }

        .topbar-divider { width: 1px; height: 22px; background: var(--paper-line); flex-shrink: 0; }

        /* 日期導覽按鈕 */
        .day-range-btn {
            display: flex; align-items: center; gap: 8px;
            background: var(--paper); border: 1px solid var(--paper-line); border-radius: 6px;
            padding: 6px 14px; cursor: pointer; transition: all 0.15s;
        }
        .day-range-btn:hover { border-color: var(--red-pen); background: #FFF8F6; }
        .day-range-nav { background: none; border: none; cursor: pointer; font-size: 11px; color: var(--ink-faint); padding: 2px 5px; border-radius: 3px; transition: color 0.1s; }
        .day-range-nav:hover { color: var(--red-pen); }
        .day-range-label { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--ink); letter-spacing: 0.3px; }
        .day-range-cal-icon { font-size: 14px; opacity: 0.6; }

        .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

        .save-status { font-size: 9.5px; color: var(--ink-faint); font-weight: 700; font-family: var(--font-mono); }
        .save-status.saved { color: var(--green-stamp); }

        .topbar-btn {
            padding: 6px 12px; border: 1px solid var(--paper-line); border-radius: 5px;
            background: var(--paper); font-size: 11px; font-weight: 700; color: var(--ink-soft);
            cursor: pointer; transition: all 0.15s; white-space: nowrap;
        }
        .topbar-btn:hover { border-color: var(--ink-faint); color: var(--ink); background: #F4F0E6; }
        .topbar-btn.ghost-github { font-size: 10.5px; }
        .present-btn:hover { border-color: var(--green-stamp); color: var(--green-stamp); }
        body.presenting .present-btn { background: var(--green-stamp); color: white; border-color: var(--green-stamp); }

        /* =====================================================
           日曆浮動視窗
        ===================================================== */
        .cal-overlay {
            position: fixed; inset: 0; z-index: 200;
            display: none;
        }
        .cal-overlay.open { display: block; }
        .cal-backdrop { position: absolute; inset: 0; }
        .cal-popup {
            position: absolute; top: calc(var(--topbar-h) + 6px); left: 50%;
            transform: translateX(-50%);
            background: var(--paper-raised); border: 1px solid var(--paper-line);
            border-radius: 10px; box-shadow: 0 16px 48px rgba(0,0,0,0.13), 0 2px 8px rgba(0,0,0,0.07);
            padding: 16px; width: 300px; z-index: 201;
            animation: popIn 0.15s ease;
        }
        @keyframes popIn { from { opacity: 0; transform: translateX(-50%) translateY(-6px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

        .cal-popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .cal-popup-header h2 { font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--ink); }
        .cal-nav-btn {
            background: var(--paper); border: 1px solid var(--paper-line); border-radius: 4px;
            width: 26px; height: 26px; cursor: pointer; color: var(--ink-soft); font-size: 10px;
        }
        .cal-nav-btn:hover { border-color: var(--red-pen); color: var(--red-pen); }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
        .cal-weekday { font-size: 9px; font-weight: 700; color: var(--ink-faint); padding: 4px 0; font-family: var(--font-mono); }
        .cal-weekday:nth-child(1) { color: var(--red-pen); }
        .cal-weekday:nth-child(7) { color: #2A4F6B; }
        .cal-day {
            background: var(--paper); border: 1px solid transparent; border-radius: 5px;
            aspect-ratio: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; cursor: pointer; transition: background 0.1s; overflow: hidden;
            position: relative;
        }
        .cal-day:hover { background: #F0EBDD; }
        .cal-day.selected { background: var(--ink) !important; }
        .cal-day.selected::before {
            content: ''; position: absolute; top: 0; right: 0; width: 0; height: 0;
            border-style: solid; border-width: 0 7px 7px 0; border-color: transparent var(--red-pen) transparent transparent;
        }
        .cal-day.selected .cal-day-num { color: var(--paper); }
        .cal-day.selected .cal-badge { background: var(--red-pen); }
        .cal-day.today:not(.selected) { border: 1.5px solid var(--green-stamp); }
        .cal-day.today:not(.selected) .cal-day-num { color: var(--green-stamp); font-weight: 800; }
        .cal-day-num { font-size: 11px; color: var(--ink-soft); font-family: var(--font-mono); line-height: 1; }
        .cal-badge {
            position: absolute; bottom: 2px; right: 2px;
            background: var(--ink-soft); color: var(--paper-raised); border-radius: 2px;
            font-size: 7px; font-weight: 700; padding: 1px 2px; min-width: 11px;
            text-align: center; font-family: var(--font-mono); line-height: 1.3;
        }
        .cal-footer { margin-top: 10px; border-top: 1px solid var(--paper-line); padding-top: 10px; display: flex; gap: 6px; justify-content: flex-end; }
        .cal-today-btn { font-size: 11px; font-weight: 700; color: var(--green-stamp); background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 4px; }
        .cal-today-btn:hover { background: rgba(47,111,94,0.08); }

        /* =====================================================
           GitHub 浮動視窗
        ===================================================== */
        .gh-overlay { position: fixed; inset: 0; z-index: 200; display: none; }
        .gh-overlay.open { display: block; }
        .gh-backdrop { position: absolute; inset: 0; }
        .gh-popup {
            position: absolute; top: calc(var(--topbar-h) + 6px); right: 20px;
            background: var(--paper-raised); border: 1px solid var(--paper-line);
            border-radius: 10px; box-shadow: 0 16px 48px rgba(0,0,0,0.13);
            padding: 16px; width: 300px; z-index: 201;
            animation: popIn 0.15s ease;
        }
        .gh-popup h3 { font-size: 11px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
        .config-warning {
            font-size: 9.5px; color: var(--amber-flag); background: #FBF3DF; border: 1px solid #E9D29A;
            border-radius: 3px; padding: 6px 8px; margin-bottom: 8px; line-height: 1.5;
        }
        .gh-popup input {
            width: 100%; padding: 7px 9px; margin-bottom: 6px;
            border: 1px solid var(--paper-line); border-radius: 4px; font-size: 11.5px;
            background: var(--paper); color: var(--ink);
        }
        .gh-popup input:focus { border-color: var(--red-pen); outline: none; background: var(--paper-raised); }
        .token-input-row { position: relative; }
        .token-input-row input { padding-right: 32px; }
        .token-toggle-btn { position: absolute; right: 4px; top: 4px; bottom: 9px; width: 26px; background: none; border: none; cursor: pointer; font-size: 11px; color: var(--ink-faint); }
        .github-sync-btn {
            width: 100%; padding: 8px; background: var(--ink); color: var(--paper);
            border: none; border-radius: 4px; font-weight: 700; cursor: pointer; font-size: 11.5px; transition: background 0.15s;
        }
        .github-sync-btn:hover { background: var(--red-pen-deep); }
        .github-sync-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .backup-row { display: flex; gap: 5px; margin-top: 8px; }
        .backup-btn {
            flex: 1; padding: 6px; background: var(--paper); border: 1px solid var(--paper-line);
            color: var(--ink-soft); border-radius: 4px; font-weight: 700; cursor: pointer; font-size: 10px;
        }
        .backup-btn:hover { border-color: var(--ink-faint); background: #F4F0E6; }
        #import-file-input { display: none; }

        /* =====================================================
           主體：左欄（週視圖）+ 右側（編輯+預覽）
        ===================================================== */
        .app-body {
            flex: 1; display: flex; overflow: hidden;
        }

        /* =====================================================
           日視圖欄
        ===================================================== */
        .day-col {
            width: 340px; flex-shrink: 0;
            background: var(--paper-raised); border-right: 1px solid var(--paper-line);
            display: flex; flex-direction: column; height: 100%; overflow: hidden;
        }
        body.presenting .day-col { display: none; }

        .day-col-header {
            padding: 14px 16px; border-bottom: 1px solid var(--paper-line); flex-shrink: 0;
            display: flex; align-items: center; justify-content: space-between;
        }
        .day-col-left { display: flex; align-items: baseline; gap: 9px; }
        .day-col-dow {
            font-family: var(--font-mono); font-size: 11px; font-weight: 700;
            color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px;
        }
        .day-col-date { font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--ink); }
        .day-col-header.is-today-date .day-col-dow,
        .day-col-header.is-today-date .day-col-date { color: var(--green-stamp); }

        .day-col-right { display: flex; align-items: center; gap: 10px; }
        .day-col-count { font-size: 10px; color: var(--ink-faint); font-family: var(--font-mono); }
        .day-col-add {
            font-size: 16px; color: var(--ink-faint); background: var(--paper); border: 1px solid var(--paper-line);
            border-radius: 6px; width: 28px; height: 28px; cursor: pointer; transition: all 0.12s;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .day-col-add:hover { color: var(--red-pen); border-color: var(--red-pen); background: #FFF8F6; }
        body.presenting .day-col-add { display: none; }

        /* 貼文列表：單日扁平清單，整欄用滾輪捲動 */
        .day-list { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }

        .post-card {
            padding: 8px 10px; border: 1px solid var(--paper-line); border-radius: 6px;
            cursor: pointer; background: var(--paper); transition: border-color 0.12s, background 0.12s;
            display: flex; gap: 10px; align-items: flex-start;
        }
        .post-card:hover { border-color: var(--ink-faint); background: var(--paper-raised); }
        .post-card.active { border-color: var(--red-pen); background: var(--paper-raised); box-shadow: 2px 2px 0 0 rgba(181,72,42,0.08); }

        .post-card-time {
            font-family: var(--font-mono); font-size: 10.5px; font-weight: 700;
            color: var(--red-pen); flex-shrink: 0; padding-top: 1px; min-width: 38px;
        }
        .post-card-body { flex: 1; min-width: 0; }
        .post-card-title {
            font-size: 12.5px; font-weight: 700; color: var(--ink);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        .post-card-preview {
            font-size: 11px; color: var(--ink-faint); line-height: 1.45;
            overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .post-card-meta {
            display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap;
        }
        .post-card-tag {
            font-size: 9.5px; font-family: var(--font-mono); font-weight: 700;
            padding: 1px 5px; border-radius: 2px; border: 1px solid var(--paper-line); color: var(--ink-faint);
        }
        .post-card-tag.has-canva { color: #6B2EC8; border-color: #C9A8F0; background: #F5EFFE; }

        .day-list-empty {
            padding: 40px 16px; text-align: center;
            font-size: 12px; color: var(--ink-faint); font-style: italic; line-height: 1.7;
        }

        /* =====================================================
           主內容：IG 預覽（置中）＋ 編輯區（右側 sidebar）
        ===================================================== */
        .main-content { flex: 1; display: flex; height: 100%; overflow: hidden; }
        .no-post-msg {
            color: var(--ink-faint); margin: auto; font-size: 13px; font-weight: 500;
            font-family: var(--font-display); text-align: center; line-height: 1.7;
        }
        body.presenting .no-post-msg { display: none !important; }

        /* 編輯區（右側 sidebar） */
        .editor-container {
            width: 380px; min-width: 380px; display: flex; flex-direction: column;
            border-left: 1px solid var(--paper-line); background: var(--paper-raised); height: 100%; overflow: hidden;
        }
        body.presenting #editor-ui { display: none !important; }
        body.presenting #preview-ui { display: flex !important; }

        .editor-scroll { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .editor-card { border: 1px solid var(--paper-line); border-radius: 6px; padding: 13px; background: var(--paper-raised); }
        .editor-card h3 {
            font-size: 10.5px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase;
            letter-spacing: 0.5px; margin-bottom: 10px; padding-bottom: 7px; border-bottom: 1px solid var(--paper-line);
        }
        .form-row { display: flex; gap: 8px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .form-group label { font-size: 10px; color: var(--ink-faint); font-weight: 700; }
        .form-group input, .form-group select {
            padding: 7px 9px; border: 1px solid var(--paper-line); border-radius: 4px;
            font-size: 12px; color: var(--ink); background: var(--paper);
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--red-pen); outline: none; background: var(--paper-raised); }

        .canva-single-row { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
        .canva-single-row input { flex: 1; padding: 7px 9px; border: 1px solid var(--paper-line); border-radius: 4px; font-size: 12px; color: var(--ink); background: var(--paper); }
        .canva-single-row input:focus { border-color: var(--red-pen); outline: none; background: var(--paper-raised); }
        .field-hint { font-size: 9.5px; color: var(--ink-faint); margin-top: 4px; line-height: 1.5; }

        .editor-card.caption-card { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .caption-card h3 { flex-shrink: 0; }
        .editor-toolbar {
            flex-shrink: 0; background: #F4F0E6; border: 1px solid var(--paper-line);
            border-radius: 5px; padding: 6px 8px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 5px;
        }
        .toolbar-row { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; }
        .tb-sep { width: 1px; height: 14px; background: var(--paper-line); margin: 0 3px; flex-shrink: 0; }
        .tb-label { font-size: 9px; font-weight: 800; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.3px; }
        .tb-btn {
            padding: 3px 7px; border: 1px solid var(--paper-line); border-radius: 3px;
            background: var(--paper-raised); color: var(--ink-soft); font-size: 10.5px; font-weight: 700;
            cursor: pointer; transition: all 0.1s; line-height: 1.4; white-space: nowrap;
        }
        .tb-btn:hover { border-color: var(--red-pen); color: var(--red-pen); background: #fff; }
        .tb-btn.active-fmt { background: var(--ink); color: var(--paper); border-color: var(--ink); }
        .color-swatch { width: 18px; height: 18px; border-radius: 3px; border: 1px solid var(--paper-line); cursor: pointer; flex-shrink: 0; transition: transform 0.1s; }
        .color-swatch:hover { transform: scale(1.15); }

        .rich-editor {
            flex: 1; min-height: 160px; border: 1px solid var(--paper-line); border-radius: 5px;
            padding: 11px 13px; font-size: 13.5px; line-height: 1.7; outline: none;
            background: var(--paper-raised); color: var(--ink); overflow-y: auto; word-break: break-word;
        }
        .rich-editor:focus { border-color: var(--red-pen); box-shadow: 0 0 0 3px rgba(181,72,42,0.07); }
        .rich-editor:empty::before { content: attr(data-placeholder); color: var(--ink-faint); pointer-events: none; }
        .rich-editor [data-block="h1"] { font-size: 20px; font-weight: 800; display: block; margin: 6px 0 2px; line-height: 1.3; }
        .rich-editor [data-block="h2"] { font-size: 16px; font-weight: 700; display: block; margin: 4px 0 2px; line-height: 1.35; }
        .rich-editor [data-block="quote"] { display: block; border-left: 3px solid var(--red-pen); padding-left: 10px; color: var(--ink-soft); font-style: italic; margin: 4px 0; }

        .editor-footer { padding: 10px 16px; border-top: 1px solid var(--paper-line); flex-shrink: 0; }
        .btn-danger {
            width: 100%; padding: 8px; background: #FBF1EC; border: 1px solid #E0A188;
            color: var(--danger); border-radius: 4px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.12s;
        }
        .btn-danger:hover { background: var(--danger); color: white; border-color: var(--danger); }

        /* IG 預覽（置中） */
        .preview-pane {
            flex: 1; overflow-y: auto; display: flex; align-items: flex-start; justify-content: center;
            padding: 28px 24px;
            background: var(--paper);
            background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,0.04) 1px, transparent 0);
            background-size: 14px 14px;
        }
        .ig-card {
            background: white; border: 1px solid #dbdbdb; border-radius: 12px;
            width: 100%; max-width: 380px; overflow: hidden;
            box-shadow: 0 8px 28px rgba(0,0,0,0.09);
        }
        body.presenting .ig-card { max-width: 420px; }
        .ig-topbar { padding: 10px 12px; display: flex; align-items: center; gap: 9px; border-bottom: 1px solid #f0f0f0; }
        .ig-avatar-ring { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); padding: 2px; flex-shrink: 0; }
        .ig-avatar-inner { width: 100%; height: 100%; border-radius: 50%; background: #e2e8f0; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #475569; }
        .ig-meta { flex: 1; }
        .ig-username { font-size: 13px; font-weight: 600; color: #262626; line-height: 1.2; }
        .ig-location { font-size: 10px; color: #8e8e8e; }
        .ig-more { font-size: 18px; color: #262626; letter-spacing: 1px; cursor: default; }
        .ig-media { width: 100%; background: #fafafa; position: relative; overflow: hidden; border-top: 1px solid #f0f0f0; border-bottom: 1px solid #f0f0f0; }
        .ig-media.r-1-1 { aspect-ratio: 1; }
        .ig-media.r-4-5 { aspect-ratio: 4/5; }
        .ig-media.r-16-9 { aspect-ratio: 16/9; }
        .ig-media-empty { display: flex; align-items: center; justify-content: center; height: 200px; color: #c7c7c7; font-size: 12px; }
        .canva-frame { width: 100%; height: 100%; border: none; display: block; }
        .canva-badge { position: absolute; bottom: 8px; left: 8px; background: rgba(100,30,200,0.85); color: white; padding: 3px 8px; border-radius: 10px; font-size: 9.5px; font-weight: 700; }
        .ig-actions { padding: 10px 12px 6px; display: flex; align-items: center; gap: 14px; }
        .ig-action-icon { font-size: 22px; cursor: default; }
        .ig-bookmark { margin-left: auto; }
        .ig-caption-area { padding: 0 12px 12px; }
        .ig-likes { font-size: 13px; font-weight: 700; color: #262626; margin-bottom: 5px; }
        .ig-caption-line { font-size: 13.5px; line-height: 1.5; color: #262626; word-break: break-word; }
        .ig-caption-line .ig-handle { font-weight: 700; margin-right: 4px; }
        .ig-caption-text-inner { display: inline; }
        .ig-more-btn { color: #8e8e8e; cursor: pointer; font-size: 12.5px; background: none; border: none; padding: 0; margin-left: 2px; }
        .ig-time { font-size: 10px; color: #8e8e8e; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.2px; }
        .hashtag-link { color: #00376b; font-weight: 600; }

        /* =====================================================
           Modal / Toast
        ===================================================== */
        .modal-overlay { position: fixed; inset: 0; background: rgba(28,27,25,0.5); display: none; align-items: center; justify-content: center; z-index: 300; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: var(--paper-raised); border-radius: 8px; padding: 20px; width: 280px; box-shadow: 0 14px 36px rgba(0,0,0,0.22); border: 1px solid var(--paper-line); }
        .modal-box p { font-size: 13px; color: var(--ink); margin-bottom: 16px; line-height: 1.55; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .modal-btn { padding: 7px 14px; border-radius: 4px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid var(--paper-line); background: var(--paper-raised); color: var(--ink-soft); }
        .modal-btn.confirm { background: var(--danger); color: white; border-color: var(--danger); }
        .toast-msg { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; opacity: 0; transition: all 0.25s; z-index: 400; pointer-events: none; max-width: 80vw; text-align: center; }
        .toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* 手機專用：桌面隱藏 */
        .mobile-header, .mobile-nav { display: none; }

        /* =====================================================
           手機版
        ===================================================== */
        @media (max-width: 767px) {
            body { flex-direction: column; }
            .topbar { padding: 0 14px; gap: 10px; }
            .brand-sub { display: none; }
            .day-range-label { font-size: 12px; }
            .app-body { flex-direction: column; overflow: hidden; }
            .day-col { width: 100%; border-right: none; border-bottom: 1px solid var(--paper-line); height: auto; max-height: 55vh; display: none; }
            .day-col.mobile-visible { display: flex; }
            .main-content { display: none; }
            .main-content.mobile-visible { display: flex; }
            #editor-ui { display: none !important; }
            .main-content.mobile-visible #preview-ui { display: flex !important; flex: 1; }
            .mobile-header { display: flex; }
            .mobile-nav { display: flex; height: 52px; background: var(--paper-raised); border-top: 1px solid var(--paper-line); flex-shrink: 0; }
            .mobile-nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: none; border: none; cursor: pointer; font-size: 18px; color: var(--ink-soft); }
            .mobile-nav-btn span { font-size: 9px; font-family: var(--font-mono); color: var(--ink-faint); }
            .mobile-nav-btn.active { color: var(--red-pen); }
            .mobile-nav-btn.active span { color: var(--red-pen); }
            .cal-popup { width: calc(100vw - 32px); left: 16px; transform: none; }
            .gh-popup { right: 14px; width: calc(100vw - 28px); }
        }
    </style>
</head>
<body>

<!-- =====================================================
     TOPBAR
===================================================== -->
<div class="topbar">
    <div class="brand-area">
        <span class="brand-mark">排版桌</span>
        <span class="brand-sub">IG POST PLANNER</span>
    </div>

    <div class="topbar-divider"></div>

    <!-- 日期導覽：點中間標籤開日曆；左右箭頭換天 -->
    <div style="display:flex; align-items:center; gap:4px;">
        <button class="day-range-nav" onclick="changeDay(-1)" title="前一天">◀</button>
        <button class="day-range-btn" onclick="toggleCalOverlay()" id="day-range-btn" title="選擇日期">
            <span class="day-range-cal-icon">📅</span>
            <span class="day-range-label" id="day-range-label">載入中…</span>
        </button>
        <button class="day-range-nav" onclick="changeDay(1)" title="後一天">▶</button>
    </div>

    <div class="topbar-right">
        <span class="save-status" id="save-status">已載入</span>
        <div class="topbar-divider"></div>
        <button class="topbar-btn ghost-github" onclick="toggleGhOverlay()">☁ 同步</button>
        <button class="topbar-btn present-btn" id="present-btn" onclick="togglePresenting()">🖥 簡報</button>
    </div>
</div>

<!-- =====================================================
     日曆浮動視窗
===================================================== -->
<div class="cal-overlay" id="cal-overlay">
    <div class="cal-backdrop" onclick="closeCalOverlay()"></div>
    <div class="cal-popup">
        <div class="cal-popup-header">
            <button class="cal-nav-btn" onclick="changeCalMonth(-1)">◀</button>
            <h2 id="cal-popup-title"></h2>
            <button class="cal-nav-btn" onclick="changeCalMonth(1)">▶</button>
        </div>
        <div class="cal-grid">
            <div class="cal-weekday">日</div><div class="cal-weekday">一</div><div class="cal-weekday">二</div>
            <div class="cal-weekday">三</div><div class="cal-weekday">四</div><div class="cal-weekday">五</div><div class="cal-weekday">六</div>
        </div>
        <div class="cal-grid" id="cal-popup-days"></div>
        <div class="cal-footer">
            <button class="cal-today-btn" onclick="goToToday()">回到今天</button>
        </div>
    </div>
</div>

<!-- =====================================================
     GitHub 浮動視窗
===================================================== -->
<div class="gh-overlay" id="gh-overlay">
    <div class="gh-backdrop" onclick="closeGhOverlay()"></div>
    <div class="gh-popup">
        <h3>☁ GitHub 雲端同步</h3>
        <div class="config-warning">Token 僅存於本機瀏覽器。請使用僅限該 repo「Contents 讀寫」的 Fine-grained Token。</div>
        <div class="token-input-row">
            <input type="password" id="gh-token" placeholder="GitHub Fine-grained Token" onchange="saveGitConfig()">
            <button type="button" class="token-toggle-btn" id="token-toggle" onclick="toggleTokenVisibility()">👁</button>
        </div>
        <input type="text" id="gh-repo" placeholder="使用者名稱/儲存庫名稱" onchange="saveGitConfig()">
        <button class="github-sync-btn" id="sync-btn" onclick="syncToGitHub()">儲存並同步到 GitHub</button>
        <div class="backup-row">
            <button class="backup-btn" onclick="exportBackup()">⬇ 匯出備份</button>
            <button class="backup-btn" onclick="document.getElementById('import-file-input').click()">⬆ 匯入備份</button>
        </div>
        <input type="file" id="import-file-input" accept="application/json" onchange="importBackup(event)">
    </div>
</div>

<!-- =====================================================
     APP BODY
===================================================== -->
<div class="app-body">

    <!-- 日視圖欄 -->
    <div class="day-col" id="day-col">
        <div class="day-col-header" id="day-col-header">
            <div class="day-col-left">
                <span class="day-col-dow" id="day-col-dow">—</span>
                <span class="day-col-date" id="day-col-date">載入中…</span>
            </div>
            <div class="day-col-right">
                <span class="day-col-count" id="day-col-count"></span>
                <button class="day-col-add" onclick="createNewPost()" title="新增貼文">＋</button>
            </div>
        </div>
        <div class="day-list" id="day-list"></div>
    </div>

    <!-- 右側：編輯 + 預覽 -->
    <div class="main-content" id="main-content-area">
        <div class="no-post-msg" id="empty-state-msg">
            選擇左側貼文開始編輯<br>
            <span style="font-size:11px; color:var(--ink-faint);">或點擊日期旁的 ＋ 新增</span>
        </div>

        <!-- IG 預覽（置中） -->
        <div class="preview-pane" id="preview-ui" style="display:none">
            <div class="ig-card">
                <div class="ig-topbar">
                    <div class="ig-avatar-ring"><div class="ig-avatar-inner" id="prev-avatar-text">大</div></div>
                    <div class="ig-meta">
                        <div class="ig-username">大田出版</div>
                        <div class="ig-location" id="prev-ig-time">09:00</div>
                    </div>
                    <div class="ig-more">···</div>
                </div>
                <div class="ig-media r-1-1" id="prev-ig-media">
                    <div class="ig-media-empty">尚未設定 Canva 連結</div>
                </div>
                <div class="ig-actions">
                    <span class="ig-action-icon">🤍</span>
                    <span class="ig-action-icon">💬</span>
                    <span class="ig-action-icon">✈️</span>
                    <span class="ig-action-icon ig-bookmark">🔖</span>
                </div>
                <div class="ig-caption-area">
                    <div class="ig-likes">讚數顯示於此</div>
                    <div class="ig-caption-line">
                        <span class="ig-handle">大田出版</span><span class="ig-caption-text-inner" id="prev-ig-caption"></span><button class="ig-more-btn" id="ig-more-trigger" style="display:none" onclick="toggleIGExpand()">更多</button>
                    </div>
                    <div class="ig-time" id="prev-ig-time-label">剛剛</div>
                </div>
            </div>
        </div>

        <!-- 編輯區（右側 sidebar） -->
        <div class="editor-container" id="editor-ui" style="display:none">
            <div class="editor-scroll">
                <div class="editor-card">
                    <h3>基本設定</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>預計發布時間</label>
                            <input type="time" id="edit-time" oninput="updateCurrentPost('time', this.value)">
                        </div>
                        <div class="form-group">
                            <label>圖片比例</label>
                            <select id="edit-ratio" onchange="updateCurrentPost('ratio', this.value)">
                                <option value="1-1">1:1 正方形</option>
                                <option value="4-5">4:5 直式</option>

                            </select>

                    </div>
                </div>

                <div class="editor-card">
                    <h3>Canva 連結</h3>
                    <div class="canva-single-row">
                        <input type="text" id="canva-url-input" placeholder="貼上 Canva 公開分享連結（結尾加 #頁碼 可跳頁）" oninput="updateCurrentPost('canvaUrl', this.value)">
                    </div>
                    <div class="field-hint">例：https://www.canva.com/design/xxx/view#2　→ 顯示第 2 頁</div>
                </div>

                <div class="editor-card caption-card">
                    <h3>貼文內文</h3>
                    <div class="editor-toolbar">
                        <div class="toolbar-row">
                            <span class="tb-label">段落</span>
                            <button class="tb-btn" onclick="applyBlock('h1')">大標 H1</button>
                            <button class="tb-btn" onclick="applyBlock('h2')">小標 H2</button>
                            <button class="tb-btn" onclick="applyBlock('quote')">引言</button>
                            <button class="tb-btn" onclick="applyBlock('p')">正文</button>
                            <div class="tb-sep"></div>
                            <button class="tb-btn" onclick="insertLineBreak()">↩ 換行</button>
                        </div>
                        <div class="toolbar-row">
                            <span class="tb-label">樣式</span>
                            <button class="tb-btn" id="tb-bold" onclick="applyInline('bold')" style="font-weight:900">B</button>
                            <button class="tb-btn" id="tb-italic" onclick="applyInline('italic')" style="font-style:italic">I</button>
                            <button class="tb-btn" id="tb-underline" onclick="applyInline('underline')" style="text-decoration:underline">U</button>
                            <button class="tb-btn" id="tb-strike" onclick="applyInline('strikeThrough')" style="text-decoration:line-through">S</button>
                            <button class="tb-btn" onclick="applyHighlight()" style="background:#F3E3A8">螢光</button>
                            <div class="tb-sep"></div>
                            <span class="tb-label">色彩</span>
                            <div class="color-swatch" style="background:#1C1B19" title="黑" onclick="applyColor('#1C1B19')"></div>
                            <div class="color-swatch" style="background:#B5482A" title="紅" onclick="applyColor('#B5482A')"></div>
                            <div class="color-swatch" style="background:#2A4F6B" title="藍" onclick="applyColor('#2A4F6B')"></div>
                            <div class="color-swatch" style="background:#2F6F5E" title="綠" onclick="applyColor('#2F6F5E')"></div>
                            <div class="color-swatch" style="background:#5B5648" title="灰" onclick="applyColor('#5B5648')"></div>

                    <div class="rich-editor" id="edit-caption" contenteditable="true"
                         data-placeholder="輸入貼文內文… 輸入 #字詞 自動套用 hashtag 樣式"

                         onkeyup="updateToolbarState()">

</div>

<!-- Modal -->
<div class="modal-overlay" id="confirm-modal">
    <div class="modal-box">
        <p id="confirm-modal-text">確定要執行此操作？</p>
        <div class="modal-actions">
            <button class="modal-btn" onclick="closeConfirmModal(false)">取消</button>
            <button class="modal-btn confirm" onclick="closeConfirmModal(true)">確定</button>
        </div>
    </div>
</div>
<div class="toast-msg" id="toast-msg"></div>

<!-- 手機底部導覽 -->
<div class="mobile-nav" id="mobile-nav">
    <button class="mobile-nav-btn active" id="mnav-day" onclick="mobileShowPanel('day')">📋<span>日視圖</span></button>
    <button class="mobile-nav-btn" id="mnav-preview" onclick="mobileShowPanel('preview')">👁<span>預覽</span></button>
</div>

<script>
/* =============================================================
   狀態
============================================================= */
let db = {};
let selectedDateStr = null;
let currentId = null;
let isIGExpanded = false;
let saveStatusTimer;
let pendingConfirmResolve = null;
let calYear, calMonth;     // 日曆浮動視窗的當前年月

/* =============================================================
   Toast / Modal
============================================================= */
function showToast(msg, dur = 2200) {
    const el = document.getElementById('toast-msg');
    el.innerText = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), dur);
}
function showConfirm(msg) {
    return new Promise(resolve => {
        pendingConfirmResolve = resolve;
        document.getElementById('confirm-modal-text').innerText = msg;
        document.getElementById('confirm-modal').classList.add('show');
    });
}
function closeConfirmModal(result) {
    document.getElementById('confirm-modal').classList.remove('show');
    if (pendingConfirmResolve) { pendingConfirmResolve(result); pendingConfirmResolve = null; }
}

/* =============================================================
   存檔
============================================================= */
function markSaved() {
    const el = document.getElementById('save-status');
    el.innerText = '✓ 已儲存'; el.classList.add('saved');
    clearTimeout(saveStatusTimer);
    saveStatusTimer = setTimeout(() => { el.innerText = '自動存本機'; el.classList.remove('saved'); }, 2000);
}
function saveLocal() { localStorage.setItem('planner_db', JSON.stringify(db)); markSaved(); }

/* =============================================================
   浮動視窗：日曆
============================================================= */
function toggleCalOverlay() {
    const overlay = document.getElementById('cal-overlay');
    if (overlay.classList.contains('open')) { closeCalOverlay(); return; }
    // 初始化到「選定日期」所在月份
    if (selectedDateStr) {
        const d = new Date(selectedDateStr);
        calYear = d.getFullYear(); calMonth = d.getMonth();
    } else {
        const now = new Date();
        calYear = now.getFullYear(); calMonth = now.getMonth();
    }
    renderCalPopup();
    overlay.classList.add('open');
}
function closeCalOverlay() {
    document.getElementById('cal-overlay').classList.remove('open');
}
function changeCalMonth(dir) {
    calMonth += dir;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalPopup();
}
function goToToday() {
    const today = new Date();
    const todayStr = fmtDate(today);
    selectDate(todayStr);
    closeCalOverlay();
}
function renderCalPopup() {
    document.getElementById('cal-popup-title').innerText = `${calYear} 年 ${String(calMonth + 1).padStart(2, '0')} 月`;
    const container = document.getElementById('cal-popup-days');
    container.innerHTML = '';
    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const totalDays = new Date(calYear, calMonth + 1, 0).getDate();
    const today = new Date();
    const todayStr = fmtDate(today);

    for (let i = 0; i < firstDay; i++) container.appendChild(document.createElement('div'));
    for (let d = 1; d <= totalDays; d++) {
        const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const div = document.createElement('div');
        div.className = 'cal-day';
        if (dateStr === selectedDateStr) div.classList.add('selected');
        if (dateStr === todayStr) div.classList.add('today');
        const numSpan = document.createElement('span');
        numSpan.className = 'cal-day-num'; numSpan.innerText = d;
        div.appendChild(numSpan);
        if (db[dateStr]?.length > 0) {
            const badge = document.createElement('span');
            badge.className = 'cal-badge'; badge.innerText = db[dateStr].length;
            div.appendChild(badge);
        }
        div.onclick = () => { selectDate(dateStr); closeCalOverlay(); };
        container.appendChild(div);
    }
}

/* =============================================================
   浮動視窗：GitHub
============================================================= */
function toggleGhOverlay() {
    const overlay = document.getElementById('gh-overlay');
    overlay.classList.toggle('open');
}
function closeGhOverlay() {
    document.getElementById('gh-overlay').classList.remove('open');
}
function toggleTokenVisibility() {
    const inp = document.getElementById('gh-token');
    const btn = document.getElementById('token-toggle');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    btn.innerText = inp.type === 'password' ? '👁' : '🙈';
}
function saveGitConfig() {
    localStorage.setItem('gh_token', document.getElementById('gh-token').value.trim());
    localStorage.setItem('gh_repo', document.getElementById('gh-repo').value.trim());
}
async function syncToGitHub() {
    const token = localStorage.getItem('gh_token');
    const repo = localStorage.getItem('gh_repo');
    const btn = document.getElementById('sync-btn');
    if (!token || !repo) { showToast('請先填寫完整 GitHub 設定'); return; }
    btn.disabled = true; btn.innerText = '同步中…'; btn.style.backgroundColor = 'var(--amber-flag)';
    const url = `https://api.github.com/repos/${repo}/contents/database.js`;
    const content = btoa(unescape(encodeURIComponent('var externalDB = ' + JSON.stringify(db, null, 2) + ';')));
    try {
        let sha = null;
        const g = await fetch(url, { headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' } });
        if (g.status === 200) sha = (await g.json()).sha;
        const p = await fetch(url, {
            method: 'PUT',
            headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json' },
            body: JSON.stringify({ message: `排版更新: ${new Date().toLocaleString()}`, content, sha })
        });
        if (p.ok) {
            const pd = await p.json().catch(() => ({}));
            if (pd.content?.sha) localStorage.setItem('gh_last_sync_sha', pd.content.sha);
            localStorage.setItem('planner_db_saved_at', new Date().toISOString());
            btn.style.backgroundColor = 'var(--green-stamp)'; btn.innerText = '✓ 同步成功！';
            setTimeout(() => { btn.disabled = false; btn.style.backgroundColor = 'var(--ink)'; btn.innerText = '儲存並同步到 GitHub'; }, 1500);
        } else {
            const e = await p.json().catch(() => ({}));
            throw new Error(e.message || `HTTP ${p.status}`);
        }
    } catch (err) {
        showToast('同步失敗：' + (err.message || '請確認設定'));
        btn.disabled = false; btn.style.backgroundColor = 'var(--ink)'; btn.innerText = '儲存並同步到 GitHub';
    }
}

/* =============================================================
   簡報模式
============================================================= */
function togglePresenting() {
    document.body.classList.toggle('presenting');
    const isPresenting = document.body.classList.contains('presenting');
    document.getElementById('present-btn').innerText = isPresenting ? '✕ 結束簡報' : '🖥 簡報';
    if (isPresenting && currentId === null && selectedDateStr) {
        const list = [...(db[selectedDateStr] || [])].sort((a, b) => (a.time || '00:00').localeCompare(b.time || '00:00'));
        if (list.length > 0) loadPost(list[0]._id);
    }
}

/* =============================================================
   備份
============================================================= */
function exportBackup() {
    const a = Object.assign(document.createElement('a'), {
        href: URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' })),
        download: `planner-backup-${new Date().toISOString().slice(0, 10)}.json`
    });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    showToast('已匯出備份'); closeGhOverlay();
}
function importBackup(event) {
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
        try {
            const parsed = JSON.parse(e.target.result);
            const ok = await showConfirm('匯入備份將覆蓋目前所有本機資料，確定繼續嗎？');
            if (!ok) { event.target.value = ''; return; }
            db = parsed; migrateIds(); saveLocal(); renderDay();
            if (selectedDateStr) selectDate(selectedDateStr);
            showToast('備份已匯入');
        } catch { showToast('匯入失敗：格式不正確'); }
        event.target.value = '';
    };
    reader.readAsText(file);
}

/* =============================================================
   資料庫
============================================================= */
function migrateIds() {
    Object.values(db).forEach(arr => {
        if (!Array.isArray(arr)) return;
        arr.forEach(p => {
            if (!p._id) p._id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
            if (!p.canvaUrl) {
                if (Array.isArray(p.img) && p.img.length > 0) p.canvaUrl = p.img[0];
                else p.canvaUrl = '';
            }
        });
    });
}
function getPostById(id) {
    if (!selectedDateStr || id === null) return null;
    return (db[selectedDateStr] || []).find(p => p._id === id) || null;
}
async function initDatabase() {
    const local = localStorage.getItem('planner_db');
    if (local) { try { db = JSON.parse(local); } catch { db = {}; } }
    else if (typeof externalDB !== 'undefined') db = externalDB;
    const token = localStorage.getItem('gh_token');
    const repo = localStorage.getItem('gh_repo');
    if (!token || !repo) return;
    try {
        const res = await fetch(`https://api.github.com/repos/${repo}/contents/database.js?nocache=${Date.now()}`, {
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' }
        });
        if (!res.ok) { if (res.status === 401 || res.status === 403) showToast('GitHub Token 無效，已改用本機'); return; }
        const fd = await res.json();
        const raw = decodeURIComponent(escape(atob(fd.content.replace(/\n/g, ''))));
        const remote = JSON.parse(raw.replace(/var\s+externalDB\s*=\s*/, '').replace(/;\s*$/, ''));
        const lastSha = localStorage.getItem('gh_last_sync_sha');
        if (fd.sha === lastSha) { showToast('已是最新資料'); return; }
        const localKeys = Object.keys(db).length;
        const remoteKeys = Object.keys(remote).length;
        const savedAt = localStorage.getItem('planner_db_saved_at');
        if (savedAt && localKeys > remoteKeys) { showToast('本機有未同步資料，請手動同步'); return; }
        db = remote; migrateIds();
        localStorage.setItem('planner_db', JSON.stringify(db));
        localStorage.setItem('gh_last_sync_sha', fd.sha);
        showToast('已從 GitHub 載入最新資料');
    } catch (e) { console.error(e); showToast('連線 GitHub 失敗，已改用本機'); }
}

/* =============================================================
   日期工具
============================================================= */
function fmtDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const DOW_LABELS = ['日','一','二','三','四','五','六'];

/* =============================================================
   日視圖
============================================================= */
function renderDay() {
    if (!selectedDateStr) return;
    const date = new Date(selectedDateStr + 'T00:00:00');
    const dStr = selectedDateStr;
    const todayStr = fmtDate(new Date());
    const isToday = dStr === todayStr;
    const posts = [...(db[dStr] || [])].sort((a, b) => (a.time||'00:00').localeCompare(b.time||'00:00'));

    // topbar 日期標籤
    document.getElementById('day-range-label').innerText =
        `${date.getMonth()+1}/${date.getDate()}（${DOW_LABELS[date.getDay()]}）`;

    // 欄標頭
    document.getElementById('day-col-dow').innerText = DOW_LABELS[date.getDay()];
    document.getElementById('day-col-date').innerText = `${date.getMonth()+1} / ${date.getDate()}`;
    document.getElementById('day-col-count').innerText = posts.length > 0 ? `共 ${posts.length} 則` : '';
    document.getElementById('day-col-header').classList.toggle('is-today-date', isToday);

    const container = document.getElementById('day-list');
    container.innerHTML = '';

    if (posts.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'day-list-empty';
        empty.innerHTML = '本日尚無貼文<br>點擊右上角「＋」新增';
        container.appendChild(empty);
    } else {
        posts.forEach(post => {
            const plain = getPlainText(post.caption || '');
            const hasCanva = !!(post.canvaUrl);
            const ratio = post.ratio || '1-1';

            const pc = document.createElement('div');
            pc.className = 'post-card' + (post._id === currentId ? ' active' : '');
            pc.onclick = () => loadPost(post._id);

            const timeEl = document.createElement('div');
            timeEl.className = 'post-card-time'; timeEl.innerText = post.time || '??:??';

            const bodyEl = document.createElement('div');
            bodyEl.className = 'post-card-body';

            const titleEl = document.createElement('div');
            titleEl.className = 'post-card-title';
            titleEl.innerText = plain.slice(0, 30) || '（無內文）';

            const previewEl = document.createElement('div');
            previewEl.className = 'post-card-preview';
            previewEl.innerText = plain.length > 30 ? plain.slice(30, 100) : '';

            const metaEl = document.createElement('div');
            metaEl.className = 'post-card-meta';

            const ratioTag = document.createElement('span');
            ratioTag.className = 'post-card-tag';
            ratioTag.innerText = ratio === '1-1' ? '1:1' : ratio === '4-5' ? '4:5' : '16:9';
            metaEl.appendChild(ratioTag);

            if (hasCanva) {
                const canvaTag = document.createElement('span');
                canvaTag.className = 'post-card-tag has-canva';
                canvaTag.innerText = 'Canva';
                metaEl.appendChild(canvaTag);
            }

            bodyEl.appendChild(titleEl);
            if (plain.length > 30) bodyEl.appendChild(previewEl);
            bodyEl.appendChild(metaEl);

            pc.appendChild(timeEl); pc.appendChild(bodyEl);
            container.appendChild(pc);
        });
    }

    // 同步更新日曆浮動視窗（如果開著）
    if (document.getElementById('cal-overlay').classList.contains('open')) renderCalPopup();
}

function changeDay(dir) {
    const base = selectedDateStr ? new Date(selectedDateStr + 'T00:00:00') : new Date();
    base.setDate(base.getDate() + dir);
    selectDate(fmtDate(base));
}

/* =============================================================
   日期選取
============================================================= */
function selectDate(dateStr) {
    selectedDateStr = dateStr;
    currentId = null;
    showEditor(false);
    renderDay();
    // 自動選第一則貼文
    const list = [...(db[dateStr] || [])].sort((a, b) => (a.time||'00:00').localeCompare(b.time||'00:00'));
    if (list.length > 0) loadPost(list[0]._id);
    if (isMobile()) mobileShowPanel('day');
}

const _scratch = document.createElement('div');
function getPlainText(html) { _scratch.innerHTML = html; return _scratch.innerText || ''; }

/* =============================================================
   編輯器開關
============================================================= */
function showEditor(visible) {
    document.getElementById('empty-state-msg').style.display = visible ? 'none' : 'flex';
    document.getElementById('editor-ui').style.display = visible ? 'flex' : 'none';
    document.getElementById('preview-ui').style.display = visible ? 'flex' : 'none';
}

/* =============================================================
   載入 / 更新貼文
============================================================= */
function loadPost(id) {
    currentId = id; isIGExpanded = false;
    const post = getPostById(id);
    if (!post) return;
    document.getElementById('edit-time').value = post.time || '09:00';
    document.getElementById('edit-ratio').value = post.ratio || '1-1';
    document.getElementById('canva-url-input').value = post.canvaUrl || '';
    document.getElementById('edit-caption').innerHTML = post.caption || '';
    showEditor(true);
    updatePreview();
    updateToolbarState();
    renderDay(); // 更新 active 樣式
    if (isMobile()) setTimeout(() => mobileShowPanel('preview'), 50);
}
function updateCurrentPost(field, value) {
    if (currentId === null) return;
    const post = getPostById(currentId);
    if (!post) return;
    post[field] = value;
    saveLocal();
    updatePreview();
    if (field !== 'caption') renderDay(); // caption 打字時不要每次重繪
}

/* =============================================================
   新增 / 刪除
============================================================= */
function createNewPost() {
    if (!selectedDateStr) return;
    if (!db[selectedDateStr]) db[selectedDateStr] = [];
    const newId = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    db[selectedDateStr].push({ _id: newId, caption: '', time: '09:00', canvaUrl: '', ratio: '1-1' });
    saveLocal(); renderDay(); loadPost(newId);
}
async function deletePost() {
    const ok = await showConfirm('確定刪除此貼文？此動作無法復原。');
    if (!ok) return;
    db[selectedDateStr] = db[selectedDateStr].filter(p => p._id !== currentId);
    currentId = null; saveLocal(); renderDay(); showEditor(false);
}

/* =============================================================
   IG 預覽
============================================================= */
function parseCanvaUrl(url) {
    if (!url || (!url.includes('canva.com') && !url.includes('canva.link'))) return null;
    const hashMatch = url.match(/#(\d+)\s*$/);
    const page = hashMatch ? hashMatch[1] : null;
    let base = url.split('#')[0].trim();
    if (!/[?&]embed(=|&|$)/.test(base)) base += (base.includes('?') ? '&' : '?') + 'embed';
    return { embedUrl: page ? `${base}#${page}` : base, page };
}
function parseHashtags(html) {
    if (!html) return '';
    return html.replace(/#([^\s<>&"'，。、！？；：「」,.!?;:()\[\]《》]+)/g, '<span class="hashtag-link">#$1</span>');
}
function updatePreview() {
    const post = getPostById(currentId);
    if (!post) return;
    document.getElementById('prev-ig-time').innerText = post.time || '09:00';
    document.getElementById('prev-ig-time-label').innerText = formatTimeLabel(post.time);
    const media = document.getElementById('prev-ig-media');
    media.className = 'ig-media r-' + (post.ratio || '1-1');
    media.innerHTML = '';
    const canva = parseCanvaUrl(post.canvaUrl || '');
    if (canva) {
        const iframe = document.createElement('iframe');
        iframe.className = 'canva-frame'; iframe.src = canva.embedUrl; iframe.loading = 'lazy';
        iframe.setAttribute('allowfullscreen', 'allowfullscreen'); iframe.setAttribute('allow', 'fullscreen');
        media.appendChild(iframe);
        const badge = document.createElement('div'); badge.className = 'canva-badge';
        badge.innerText = canva.page ? `Canva · 第 ${canva.page} 頁` : 'Canva';
        media.appendChild(badge);
    } else {
        media.innerHTML = '<div class="ig-media-empty">尚未設定 Canva 連結</div>';
    }
    const raw = post.caption || '';
    const plain = getPlainText(raw);
    const captionEl = document.getElementById('prev-ig-caption');
    const moreBtn = document.getElementById('ig-more-trigger');
    if (!isIGExpanded && (plain.length > 80 || raw.includes('\n') || raw.includes('<br'))) {
        captionEl.innerHTML = parseHashtags(plain.slice(0, 75)) + '…';
        moreBtn.innerText = '更多'; moreBtn.style.display = 'inline';
    } else if (isIGExpanded) {
        captionEl.innerHTML = parseHashtags(raw); moreBtn.innerText = '收起'; moreBtn.style.display = 'inline';
    } else {
        captionEl.innerHTML = parseHashtags(raw); moreBtn.style.display = 'none';
    }
}
function toggleIGExpand() { isIGExpanded = !isIGExpanded; updatePreview(); }
function formatTimeLabel(time) {
    if (!time) return '剛剛';
    const [h, m] = time.split(':').map(Number);
    const ampm = h < 12 ? '上午' : '下午';
    return `預計 ${ampm} ${h % 12 || 12}:${String(m).padStart(2, '0')}`;
}

/* =============================================================
   文字編輯器
============================================================= */
function applyBlock(type) {
    const editor = document.getElementById('edit-caption'); editor.focus();
    const sel = window.getSelection(); if (!sel.rangeCount) return;
    if (type === 'p') {
        document.execCommand('formatBlock', false, 'div');
        let node = sel.getRangeAt(0).commonAncestorContainer;
        while (node && node !== editor) { if (node.nodeType === 1 && node.hasAttribute?.('data-block')) { node.removeAttribute('data-block'); node.className = ''; } node = node.parentNode; }
    } else {
        document.execCommand('formatBlock', false, 'div');
        let node = sel.getRangeAt(0).commonAncestorContainer;
        while (node && node !== editor) { if (node.nodeType === 1 && node.tagName === 'DIV') { node.setAttribute('data-block', type); break; } node = node.parentNode; }
    }
    onCaptionInput();
}
function applyInline(command) { const e = document.getElementById('edit-caption'); e.focus(); document.execCommand(command, false, null); onCaptionInput(); updateToolbarState(); }
function applyHighlight() { document.getElementById('edit-caption').focus(); document.execCommand('backColor', false, 'rgba(232,196,84,0.5)'); onCaptionInput(); }
function applyColor(hex) { document.getElementById('edit-caption').focus(); document.execCommand('foreColor', false, hex); onCaptionInput(); }
function clearFormat() {
    const editor = document.getElementById('edit-caption'); editor.focus();
    const sel = window.getSelection();
    if (sel.rangeCount) {
        document.execCommand('removeFormat', false, null);
        let node = sel.getRangeAt(0).commonAncestorContainer;
        while (node && node !== editor) { if (node.nodeType === 1 && node.hasAttribute?.('data-block')) node.removeAttribute('data-block'); node = node.parentNode; }
    }
    onCaptionInput();
}
function insertLineBreak() {
    const editor = document.getElementById('edit-caption'); editor.focus();
    const sel = window.getSelection(); if (!sel.rangeCount) return;
    const range = sel.getRangeAt(0); range.deleteContents();
    const br = document.createElement('br'); range.insertNode(br);
    const after = document.createRange(); after.setStartAfter(br); after.collapse(true);
    sel.removeAllRanges(); sel.addRange(after);
    onCaptionInput();
}
function onCaptionKeydown(e) { if (e.key === 'Enter' && e.shiftKey) { e.preventDefault(); insertLineBreak(); } }
function onCaptionInput() { updateCurrentPost('caption', document.getElementById('edit-caption').innerHTML); }
function updateToolbarState() {
    ['bold','italic','underline','strikeThrough'].forEach((cmd, i) => {
        document.getElementById(['tb-bold','tb-italic','tb-underline','tb-strike'][i]).classList.toggle('active-fmt', document.queryCommandState(cmd));
    });
}

/* =============================================================
   手機版
============================================================= */
function isMobile() { return window.innerWidth <= 767; }
let mobileCurrentPanel = 'day';
function mobileShowPanel(panel) {
    if (!isMobile()) return;
    mobileCurrentPanel = panel;
    document.getElementById('day-col').classList.toggle('mobile-visible', panel === 'day');
    document.getElementById('main-content-area').classList.toggle('mobile-visible', panel === 'preview');
    ['day','preview'].forEach(k => document.getElementById('mnav-' + k)?.classList.remove('active'));
    document.getElementById('mnav-' + panel)?.classList.add('active');
}

/* =============================================================
   啟動
============================================================= */
window.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';
    document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';
    await initDatabase();
    migrateIds();
    // 跳到今天並選取
    const today = new Date();
    const todayStr = fmtDate(today);
    selectDate(todayStr);
    renderDay();
    if (isMobile()) { document.getElementById('day-col').classList.add('mobile-visible'); }
});
</script>
